# ~/.config/hypr/hyprlock.conf
# Theme: Catppuccin Mocha base + dynamic accent from matugen.
# Background: blurred current wallpaper from ~/.cache/current_wallpaper.
# Clock: large, centered, JetBrains Mono Nerd Font.
# Input field: rounded pill, glassmorphism.

# ─── Background ──────────────────────────────────────────────────────────────

background {
    monitor =
    path = $HOME/.cache/current_wallpaper   # Written by wallpaper-change.sh on each change.
    blur_size = 6
    blur_passes = 3
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# ─── Clock ───────────────────────────────────────────────────────────────────

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(cdd6f4ff)               # Catppuccin Mocha Text
    font_size = 96
    font_family = JetBrains Mono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %B %d')"
    color = rgba(bac2deff)               # Catppuccin Mocha Subtext 1
    font_size = 24
    font_family = JetBrains Mono Nerd Font
    position = 0, -10
    halign = center
    valign = center
}

# ─── Input field ─────────────────────────────────────────────────────────────
# Rounded pill, glassmorphism: semi-transparent surface, blurred backdrop.

input-field {
    monitor =
    size = 340, 52
    rounding = 26                        # Full pill — radius = height/2

    # Glassmorphism fill: Catppuccin Surface 0 at ~50% opacity.
    inner_color = rgba(31323488)
    outer_color = rgba(b4befeff)         # Lavender fallback accent — matugen overrides this
                                         # via $accent in colors.conf if sourced below.
    outline_thickness = 2
    check_color = rgba(b4befeff)
    fail_color = rgba(f38ba8ff)          # Catppuccin Mocha Red — password fail

    font_color = rgba(cdd6f4ff)          # Catppuccin Mocha Text
    font_family = JetBrains Mono Nerd Font
    font_size = 16

    placeholder_text = <i>password</i>
    hide_input = false
    capslock_color = rgba(fab387ff)      # Catppuccin Mocha Peach — Caps Lock warning
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true

    position = 0, -120
    halign = center
    valign = center

    fade_on_empty = true
    fade_timeout = 1000

    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(11111b88)        # Catppuccin Mocha Crust at ~53% opacity
}

# ─── Greeting label ──────────────────────────────────────────────────────────

label {
    monitor =
    text = simone
    color = rgba(bac2deff)               # Catppuccin Mocha Subtext 1
    font_size = 18
    font_family = JetBrains Mono Nerd Font
    position = 0, -180
    halign = center
    valign = center
}
