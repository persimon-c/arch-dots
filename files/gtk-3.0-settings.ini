# ~/.config/gtk-3.0/settings.ini
# Sets the cursor theme for GTK apps so they use Catppuccin-Mocha-Dark
# instead of the default cursor theme.
# This must be set here in addition to the XCURSOR_THEME env var in env.conf —
# the env var covers Wayland-native apps, this file covers GTK apps specifically.

[Settings]
gtk-cursor-theme-name=Catppuccin-Mocha-Dark
gtk-cursor-theme-size=24
