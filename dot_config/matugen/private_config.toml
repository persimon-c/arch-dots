# ~/.config/matugen/config.toml
# Run: matugen image ~/wallpapers/yourwallpaper.jpg
# post_hook entries handle per-app reloads after generation.

[config]
mode = "dark"
scheme_type = "tonal-spot"

# ── Quickshell ────────────────────────────────────────────────────────────────
# Colors.qml watches this file via FileView — no reload signal needed.

[templates.quickshell_colors]
input_path  = "~/.config/matugen/templates/quickshell-colors.json"
output_path = "~/.config/quickshell/theme/colors.json"

# ── Hyprland ──────────────────────────────────────────────────────────────────
# dofile()'d by modules/colors.lua — reload Hyprland after write.

[templates.hyprland]
input_path  = "~/.config/matugen/templates/hypr-colors.lua"
output_path = "~/.config/hypr/modules/hypr-colors.lua"
post_hook   = "hyprctl reload"

# ── Kitty ─────────────────────────────────────────────────────────────────────

[templates.kitty]
input_path  = "~/.config/matugen/templates/kitty-colors.conf"
output_path = "~/.config/kitty/matugen-colors.conf"
post_hook   = "kitty @ set-colors --all ~/.config/kitty/matugen-colors.conf"

# ── GTK 3 + 4 ────────────────────────────────────────────────────────────────

[templates.gtk3]
input_path  = "~/.config/matugen/templates/gtk.css"
output_path = "~/.config/gtk-3.0/colors.css"

[templates.gtk4]
input_path  = "~/.config/matugen/templates/gtk.css"
output_path = "~/.config/gtk-4.0/colors.css"

# ── Cava ─────────────────────────────────────────────────────────────────────

[templates.cava]
input_path  = "~/.config/matugen/templates/cava.ini"
output_path = "~/.config/cava/config"
post_hook   = "pkill -USR1 cava"

# ── Zathura ───────────────────────────────────────────────────────────────────
# No reload needed — reads on open.

[templates.zathura]
input_path  = "~/.config/matugen/templates/zathura.conf"
output_path = "~/.config/zathura/zathurarc"

# ── Shell scripts ─────────────────────────────────────────────────────────────

[templates.colors_sh]
input_path  = "~/.config/matugen/templates/colors.sh"
output_path = "~/.config/matugen/colors.sh"

# ── CSS (legacy — kept for reference) ────────────────────────────────────────

[templates.colors_css]
input_path  = "~/.config/matugen/templates/colors.css"
output_path = "~/.config/matugen/colors.css"

# ── Fastfetch ─────────────────────────────────────────────────────────────────

[templates.fastfetch]
input_path  = "~/.config/matugen/templates/fastfetch-colors.jsonc"
output_path = "~/.config/fastfetch/colors.jsonc"
