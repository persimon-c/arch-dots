# ~/.config/matugen/config.toml
# Run: matugen image ~/wallpapers/yourwallpaper.jpg
# The wallpaper script handles per-app reloads after generation.

[config]
mode = "dark"
scheme_type = "vibrant"

# ── Quickshell ────────────────────────────────────────────────────────────────
# Colors.qml watches this file via FileView — no reload signal needed.

[templates.quickshell_colors]
input_path  = "~/.config/matugen/templates/quickshell-colors.json"
output_path = "~/.config/quickshell/theme/colors.json"

# ── Hyprland ──────────────────────────────────────────────────────────────────
# dofile()'d by modules/colors.lua — Hyprland is reloaded by the wallpaper script.

[templates.hyprland]
input_path  = "~/.config/matugen/templates/hypr-colors.lua"
output_path = "~/.config/hypr/modules/colors.lua"


# ── Kitty ─────────────────────────────────────────────────────────────────────

[templates.kitty]
input_path  = "~/.config/matugen/templates/kitty-colors.conf"
output_path = "~/.config/kitty/matugen-colors.conf"


# ── GTK 3 + 4 ────────────────────────────────────────────────────────────────
# gtk3: uses gtk3-thunar.css — maps matugen palette to classic GTK3 named
#        colors (theme_bg_color, theme_selected_bg_color, etc.) + direct CSS
#        rules targeting Thunar's widget selectors (.sidebar, .view, etc.).
#        Output is imported by ~/.config/gtk-3.0/gtk.css via @import 'colors.css'.
#
# gtk4: uses gtk.css — libadwaita named colors (window_bg_color, accent_bg_color,
#        etc.) for GTK4/libadwaita apps. Unchanged from original.

[templates.gtk3]
input_path  = "~/.config/matugen/templates/gtk3-thunar.css"
output_path = "~/.config/gtk-3.0/colors.css"

[templates.gtk4]
input_path  = "~/.config/matugen/templates/gtk.css"
output_path = "~/.config/gtk-4.0/colors.css"

# ── Cava ─────────────────────────────────────────────────────────────────────

[templates.cava]
input_path  = "~/.config/matugen/templates/cava.ini"
output_path = "~/.config/cava/config"


# ── Zathura ───────────────────────────────────────────────────────────────────
# No reload needed — reads on open.

[templates.zathura]
input_path  = "~/.config/matugen/templates/zathura.conf"
output_path = "~/.config/zathura/zathurarc"

# ── Shell scripts ─────────────────────────────────────────────────────────────

[templates.colors_sh]
input_path  = "~/.config/matugen/templates/colors.sh"
output_path = "~/.config/matugen/colors.sh"

# ── CSS (legacy — kept for reference) ────────────────────────────────────────

# [templates.colors_css]
# input_path  = "~/.config/matugen/templates/colors.css"
# output_path = "~/.config/matugen/colors.css"

# ── Fastfetch ─────────────────────────────────────────────────────────────────

[templates.fastfetch]
input_path  = "~/.config/matugen/templates/fastfetch-colors.jsonc"
output_path = "~/.config/fastfetch/colors.jsonc"