# ~/.config/matugen/templates/kitty-colors.conf
# Kitty color format generated by matugen.
# Included by kitty.conf — overrides cursor and active_border_color with the
# wallpaper-derived accent. Everything else stays Catppuccin Mocha (hardcoded
# in kitty.conf).
# Generated by: matugen image <path>

# Dynamic accent applied to cursor and active border.
cursor                  {{ colors.primary.default.hex }}
cursor_text_color       {{ colors.on_primary.default.hex }}
active_border_color     {{ colors.primary.default.hex }}

# Tab bar active tab gets the accent as well.
active_tab_background   {{ colors.primary.default.hex }}
active_tab_foreground   {{ colors.on_primary.default.hex }}

# URL color follows accent.
url_color               {{ colors.primary.default.hex }}
