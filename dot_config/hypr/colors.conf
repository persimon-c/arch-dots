# ~/.config/matugen/templates/hypr-colors.conf
# Hyprland variable format generated by matugen.
# Sourced by hyprland.conf (source = ~/.config/hypr/colors.conf).
# These variables are used in general {} for border gradient colors.
# Generated by: matugen image <path>

# Primary dynamic accent — replaces the Lavender fallback in the border gradient.
# Used as: col.active_border = rgba($accentff) rgba($flamingoHardcodedff) 45deg
$accent = aec6ff

# Container variant — useful for a subtler secondary gradient stop if desired.
$accent_container = 2b4678

# The Flamingo/Peach values used in the border gradient are hardcoded in
# decoration.conf — they are fixed semantic colors that should not vary
# with the wallpaper. Only $accent is dynamic.
