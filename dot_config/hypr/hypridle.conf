# ~/.config/hypr/hypridle.conf
# Idle management: 5 min → lock, 10 min → display off.
# Resume: display turns back on when mouse moves or key is pressed (controlled
# by misc.mouse_move_enables_dpms and misc.key_press_enables_dpms in hyprland.conf).

general {
    lock_cmd = pidof hyprlock || hyprlock    # Do not spawn a new hyprlock if one is already running.
    before_sleep_cmd = hyprlock             # Lock immediately before suspend.
    after_sleep_cmd = hyprctl dispatch dpms on  # Turn display back on after resume.
    ignore_dbus_inhibit = false             # Respect inhibit signals (e.g. from video players, presentations).
}

# 5 minutes idle → lock screen
listener {
    timeout = 300
    on-timeout = hyprlock
}

# 10 minutes idle → display off
listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
