# ~/.config/kitty/kitty.conf
# Color scheme: Catppuccin Mocha base (hardcoded) + dynamic accent from matugen.
# Dynamic colors are written to ~/.config/kitty/matugen-colors.conf by the
# wallpaper-change script and included at the bottom of this file.

# ─── Font ────────────────────────────────────────────────────────────────────

font_family      GeistMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto   
font_size        10.0

# ─── Cursor ──────────────────────────────────────────────────────────────────

cursor_shape     beam
cursor_blink_interval 0.5
cursor_trail     1
# cursor_color is set dynamically in matugen-colors.conf (dynamic accent).
# Lavender is the fallback if that file is absent or has not been generated yet.
cursor           #b4befe

# ─── Window ──────────────────────────────────────────────────────────────────

background_opacity 0.88
window_padding_width 12
window_padding_height 10

# ─── Catppuccin Mocha base colors ────────────────────────────────────────────
# These are hardcoded and never replaced by matugen — only accent colors change.

# Special
foreground              #cdd6f4
background              #1e1e2e
selection_foreground    #1e1e2e
selection_background    #b4befe

# Cursor (fallback; overridden in matugen-colors.conf)
cursor                  #b4befe
cursor_text_color       #1e1e2e

# URL color
url_color               #b4befe

# Window border colors
active_border_color     #b4befe
inactive_border_color   #45475a
bell_border_color       #f9e2af

# Tab bar
active_tab_foreground   #1e1e2e
active_tab_background   #b4befe
inactive_tab_foreground #cdd6f4
inactive_tab_background #1e1e2e
tab_bar_background      #11111b

# Terminal colors (Catppuccin Mocha palette)
# Black
color0  #45475a
color8  #585b70
# Red
color1  #f38ba8
color9  #f38ba8
# Green
color2  #a6e3a1
color10 #a6e3a1
# Yellow
color3  #f9e2af
color11 #f9e2af
# Blue
color4  #89b4fa
color12 #89b4fa
# Magenta/Mauve
color5  #cba4f7
color13 #cba4f7
# Cyan/Sky
color6  #89dceb
color14 #89dceb
# White
color7  #bac2de
color15 #a6adc8

# ─── Dynamic accent colors from matugen ──────────────────────────────────────
# This file is written by the wallpaper-change script after each wallpaper change.
# It overrides cursor_color and active_border_color with the wallpaper-derived accent.
# If the file does not exist yet (first boot), kitty falls back to the Lavender
# values hardcoded above.

include matugen-colors.conf

allow_remote_control yes
